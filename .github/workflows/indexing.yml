name: Indexing
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  indexnow:
    name: Submit URLs to IndexNow
    runs-on: ubuntu-slim

    steps:
      - name: Submit URLs to IndexNow
        uses: bojieyang/indexnow-action@38ddfbd93579a8a44c0dee662121bf9d51098f71 # v3.0.0
        with:
          sitemap-location: ${{ vars.SITE_BASE_URL }}/sitemap-0.xml
          key: ${{ secrets.INDEXNOW_KEY }}
          key-location: ${{ vars.SITE_BASE_URL }}/IndexNow-${{ secrets.INDEXNOW_KEY }}.txt
          failure-strategy: error
          endpoint: api.indexnow.org
